<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedFit Planner</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    margin: 0;
}
header {
    background: #1e293b;
    padding: 15px;
    text-align: center;
    font-size: 22px;
}
.container { padding: 15px; }
.card {
    background: #1e293b;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 15px;
}
button {
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #3b82f6;
    color: white;
}
</style>
</head>

<body>

<header>🔥 MedFit Planner</header>

<div class="container">

<div class="card">
<h3>🔐 Cuenta</h3>
<input id="email" placeholder="Correo"><br><br>
<input id="password" type="password" placeholder="Contraseña"><br><br>
<button onclick="register()">Registrarse</button>
<button onclick="login()">Entrar</button>
<p id="user"></p>
</div>

<div class="card">
<h3>📅 Mi horario</h3>
<div id="calendar"></div>
</div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>

// ===== FIREBASE =====
const firebaseConfig = {
  apiKey: "AIzaSyC9zj9mVnnYj5ouk5u22hB9VX_q9TKvVwM",
  authDomain: "medfit-planner.firebaseapp.com",
  projectId: "medfit-planner",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
// ===== LOGIN =====
function register() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
  .then(() => alert("Usuario creado 🎉"))
  .catch(err => alert(err.message));
}

function login() {
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
  .then(() => alert("Bienvenido 😎"))
  .catch(err => alert(err.message));
}

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("user").innerText = "Conectado: " + user.email;
  }
});

// ===== CALENDARIO =====
    auth.onAuthStateChanged(async user => {
  if(user){

    const snapshot = await db.collection("eventos")
      .where("user", "==", user.uid)
      .get();

    snapshot.forEach(doc => {
      let data = doc.data();

      calendar.addEvent({
        title: data.titulo,
        start: data.inicio.toDate(),
        end: data.fin.toDate()
      });
    });

  }
});
document.addEventListener('DOMContentLoaded', function() {
  var calendar = new FullCalendar.Calendar(
    document.getElementById('calendar'),
    {
      initialView: 'timeGridWeek',
      selectable: true,
      select: async function(info) {
  let titulo = prompt("Evento:");

  if(titulo && auth.currentUser){

    await db.collection("eventos").add({
      titulo: titulo,
      inicio: info.start,
      fin: info.end,
      user: auth.currentUser.uid
    });

    calendar.addEvent({
      title: titulo,
      start: info.start,
      end: info.end
    });

  } else {
    alert("Debes iniciar sesión primero 😅");
  }
      }
        let titulo = prompt("Evento:");
        if(titulo){
          calendar.addEvent({
            title: titulo,
            start: info.start,
            end: info.end
          });
        }
      }
    }
  );
  calendar.render();
});

</script>

</body>
</html>
